name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (installs frank-create deps + type-checks + builds)
        run: npm run build
      - name: Test
        run: npm --prefix frank-create test -- --reporter=dot
        env:
          DEBUG_PRINT_LIMIT: "0"
      - name: Lint (non-blocking)
        run: npm --prefix frank-create run lint
        continue-on-error: true
