# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: "Only comment on issues introduced by this PR's changes. Do not flag pre-existing problems in moved, re-indented, or reformatted code."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: false
  review_details: false
  commit_status: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/*.png"
    - "!**/*.jpg"

  path_instructions:
    - path: "**"
      instructions: |
        IMPORTANT: Only comment on issues directly introduced by this PR's code changes.
        Do NOT flag pre-existing issues in code that was merely moved, re-indented,
        de-indented, or reformatted without logic changes. If code appears in the diff
        only due to whitespace or structural reformatting, treat it as unchanged.
        Contributors should not feel obligated to address pre-existing issues outside
        the scope of their contribution.
    - path: "frank-create/src/**"
      instructions: |
        React + Vite + TypeScript SPA. Focus on:
        - Behavior-preserving refactors (App.tsx is being decomposed into lib/ and components/)
        - React hook correctness (dependency arrays, conditional hooks)
        - Type safety (avoid `any`; use shared types from src/lib/types.ts)
        - No secrets in client code (only VITE_*-prefixed public keys belong here)
    - path: "frank-create/server/**"
      instructions: |
        In-process API middleware (frankApi.ts) running on Lovable AI Gateway + Supabase. Focus on:
        - No hardcoded secrets; server-only env (SERVICE_ROLE_KEY, LOVABLE_API_KEY) must not leak to the client
        - Proper auth gating and error handling for external API failures (timeouts, rate limits)
        - Safe handling of user-supplied prompts and uploaded media
    - path: "supabase/**"
      instructions: |
        Supabase config and edge functions. Focus on:
        - Row-level security and per-user scoping (auth.uid())
        - Migration/config safety

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
      - "DO NOT MERGE"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    ruff:
      enabled: false
    pylint:
      enabled: false
    flake8:
      enabled: false
    gitleaks:
      enabled: true
    shellcheck:
      enabled: false
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    languagetool:
      enabled: false
    github-checks:
      enabled: true
      timeout_ms: 90000
    ast-grep:
      essential_rules: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
